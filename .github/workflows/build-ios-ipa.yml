name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: "true"
      APP_DIR: artifacts/project-istiqamah

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen generate --spec project.json

      - name: Build unsigned device app
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          rm -rf build
          xcodebuild \
            -project ProjectIstiqamah.xcodeproj \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package and verify IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          app_path="build/DerivedData/Build/Products/Release-iphoneos/ProjectIstiqamah.app"
          ipa_path="build/ProjectIstiqamah-unsigned.ipa"
          widget_path="$app_path/PlugIns/ProjectIstiqamahWidgets.appex"

          if [[ ! -d "$app_path" ]]; then
            echo "Expected app was not produced at $app_path" >&2
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print
            exit 1
          fi

          if [[ ! -d "$widget_path" ]]; then
            echo "Expected Live Activity extension was not embedded at $widget_path" >&2
            exit 1
          fi

          if codesign --verify "$app_path" >/dev/null 2>&1; then
            echo "Expected an unsigned app, but a valid signature was found" >&2
            exit 1
          fi

          rm -rf build/package
          mkdir -p build/package/Payload
          ditto "$app_path" "build/package/Payload/ProjectIstiqamah.app"

          (
            cd build/package
            /usr/bin/zip -qry "../ProjectIstiqamah-unsigned.ipa" Payload
          )

          unzip -tq "$ipa_path"
          test -s "$ipa_path"

      - name: Publish direct IPA download
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: [redacted] github.token }}
        run: |
          set -euo pipefail

          ipa_path="build/ProjectIstiqamah-unsigned.ipa"
          asset_name="ProjectIstiqamah-unsigned.ipa"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="unsigned-build-${GITHUB_RUN_NUMBER}"
            release_title="Unsigned iOS IPA build ${GITHUB_RUN_NUMBER}"
          else
            release_tag="$GITHUB_REF_NAME"
            release_title="Project Istiqamah ${GITHUB_REF_NAME}"
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$ipa_path" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$release_tag" "$ipa_path" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "Unsigned device IPA from workflow run ${GITHUB_RUN_NUMBER}." \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "$ipa_path" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "Unsigned device IPA built from tag ${GITHUB_REF_NAME}." \
              --repo "$GITHUB_REPOSITORY"
          fi

          asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${asset_name}"
          {
            echo "## Unsigned IPA ready"
            echo
            echo "[Download ProjectIstiqamah-unsigned.ipa](${asset_url})"
            echo
            echo "This is an unsigned device build and must be installed with a compatible sideloading/signing tool."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact (ZIP fallback)
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
